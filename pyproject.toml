[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cci-dashboard-metrology"
version = "0.1.0"
description = "Metrology viewer for the CCI dashboard"
requires-python = ">=3.12"
dependencies = ["Django>=5.2,<5.3"]
license = "MIT"

[tool.setuptools.packages.find]
include = ["dashboard_metrology*"]

[tool.setuptools]
license-files = ["LICENSE", "METEOR_VIEW_LICENSE"]

[tool.setuptools.package-data]
dashboard_metrology = ["templates/dashboard_metrology/*.html", "static/dashboard_metrology/*.js", "static/dashboard_metrology/*.css", "static/dashboard_metrology/images/*.png"]
